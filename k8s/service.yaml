apiVersion: v1
kind: Service
metadata: {name: icreate-automation-engine-svc}
spec:
  selector: {app: icreate-automation-engine}
  ports:
  - name: http
    port: 80
    targetPort: 8000
  - name: ws
    port: 8765
    targetPort: 8765
  - name: metrics
    port: 9001
    targetPort: 9001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: icreate-automation-engine-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: icreate-automation-engine}
  minReplicas: 3
  maxReplicas: 20
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
