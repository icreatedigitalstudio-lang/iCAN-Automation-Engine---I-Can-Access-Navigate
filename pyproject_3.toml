[project]
name = "icreate-automation-engine"
version = "2.0.0"
description = "iCREATE Automation Engine - Global Standards Production Automation Engine + MCP + Multi-Connector"
authors = [{name="iCREATE Digital Studio", email="studio@icreate.ph"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text="MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "rich>=13.7",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "mypy", "httpx"]

[project.scripts]
icreate = "pyautoforge.cli:main"
pyautoforge = "pyautoforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
